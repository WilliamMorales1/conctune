[project]
name = "conctune"
dynamic = ["version"]
description = "Find the worker count a task should run at, and say what is limiting it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Morales" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
keywords = [
    "concurrency",
    "parallelism",
    "benchmark",
    "universal-scalability-law",
    "performance",
    "workers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/WilliamMorales1/conctune"
Repository = "https://github.com/WilliamMorales1/conctune"
Issues = "https://github.com/WilliamMorales1/conctune/issues"
Documentation = "https://github.com/WilliamMorales1/conctune/blob/main/docs/model.md"

[project.scripts]
conctune = "conctune.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["conctune"]

[tool.setuptools.dynamic]
version = { attr = "conctune.__version__" }

[tool.setuptools.package-data]
conctune = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "ISC", "PLW", "EXE"]
# The formatter owns line length; module-level caches use `global` on purpose.
ignore = ["E501", "B905", "PLW0603"]

[tool.pyright]
include = ["conctune", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = ["slow: runs the full demo workload"]
