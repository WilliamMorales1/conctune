name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e . pytest ruff pyright

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pyright
        run: pyright

      - name: Pytest
        run: pytest
